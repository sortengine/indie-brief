name: Daily briefing

on:
  workflow_dispatch:        # adds a "Run workflow" button so you can run it by hand

permissions:
  contents: write           # lets the robot save the new episode into the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Build today's episode
        run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save episode to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Episode $(date -u +%F)" || echo "Nothing new to save"
          git push
